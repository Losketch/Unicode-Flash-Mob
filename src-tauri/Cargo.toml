[package]
name = "unicode_flash_mob"
version = "3.1.1"
edition = "2021"
rust-version = "1.88"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[features]
default = ["gui"]
gui = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build", "dep:tokio"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.25"
ab_glyph = "0.2"
resvg = "0.47"
image = "0.25"
crossbeam-channel = "0.5"
indicatif = "0.17"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
once_cell = "1"
parley = { version = "0.11", default-features = false, features = ["std", "complex-scripts"] }
swash = "0.2.10"
tauri = { version = "2", optional = true, features = [] }
tauri-plugin-dialog = { version = "2", optional = true }
tokio = { version = "1", features = ["full"], optional = true }

[patch.crates-io]
usvg = { path = "../vendor/usvg" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
debug = false
split-debuginfo = 'off'
debug-assertions = false
overflow-checks = false
incremental = false
rpath = false

# Reduce incremental link time for the Tauri dependency graph.
[profile.dev]
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 1
debug = false
