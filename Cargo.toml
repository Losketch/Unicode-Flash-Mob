[package]
name = "unicode_flash_mob"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
reqwest = { version = "0.11", features = ["blocking", "rustls-tls"] }
regex = "1"
anyhow = "1"
ttf-parser = "0.25"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
split-debuginfo = 'off'
debug-assertions = false
overflow-checks = false
incremental = false
rpath = false